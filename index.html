    <style>
      :root {
        scroll-behavior: smooth;

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;

        margin: 0;

      .glass-card {

        border: 1px solid rgba(87, 106, 143, 0.1);

      }
      .text-gradient {
        background: linear-gradient(135deg, #576A8F 0%, #FF7444 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .btn-gradient {
        background: linear-gradient(135deg, #FF7444 0%, #576A8F 100%);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

      }
      .btn-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(255, 116, 68, 0.3);
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      .mesh-bg {
        background-image: 
          radial-gradient(at 0% 0%, rgba(183, 189, 247, 0.15) 0, transparent 50%),
          radial-gradient(at 100% 0%, rgba(255, 116, 68, 0.1) 0, transparent 50%),
          radial-gradient(at 50% 100%, rgba(87, 106, 143, 0.05) 0, transparent 50%);
