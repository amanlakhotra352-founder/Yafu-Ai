
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yafu AI | Intelligent Automation & Business Growth Agency</title>
    <meta name="description" content="Yafu AI specializing in intelligent automation, AI voice agents, and high-converting chatbots for SMBs." />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yafu AI | Intelligent Automation" />
    <meta property="og:description" content="Transforming businesses with intelligent AI solutions that work 24/7." />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #030712;
        color: #f3f4f6;
        margin: 0;
        overflow-x: hidden;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .text-gradient {
        background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f97316 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .btn-gradient {
        background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .btn-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.4);
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      .mesh-bg {
        background-image: 
          radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.12) 0, transparent 50%),
          radial-gradient(at 100% 0%, rgba(219, 39, 119, 0.12) 0, transparent 50%),
          radial-gradient(at 50% 100%, rgba(59, 130, 246, 0.08) 0, transparent 50%);
        background-attachment: fixed;
      }
    </style>

        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3"
      }
    }
    </script>
  </head>
  <body class="mesh-bg">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
